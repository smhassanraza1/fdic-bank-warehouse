name: CI

on:
  push:
  pull_request:

# Nothing here writes back to the repo; the token only needs to read it.
permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Install dependencies
        run: uv sync --group dev --group api --group bigquery --group streaming --group spark

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Unit tests (pytest)
        run: uv run pytest

