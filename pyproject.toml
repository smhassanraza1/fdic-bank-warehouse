[project]
name = "fig-data-platform"
version = "0.1.0"
description = "Batch + streaming ingestion of FDIC bank financials into a dbt-modelled BigQuery star schema, orchestrated in Airflow, served via FastAPI."
requires-python = ">=3.13"
dependencies = [
    "boto3>=1.43.59",
    "httpx>=0.28.1",
    "pyarrow>=18.0.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
api = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.0",
    # Included directly so the api group doesn't depend on the bigquery group.
    "google-cloud-bigquery>=3.27.0",
]
bigquery = [
    "google-cloud-bigquery>=3.27.0",
]
dbt = [
    "dbt-bigquery>=1.12.0",
    "dbt-core>=1.12.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.0",
    "pyyaml>=6.0.3",
]
spark = [
    "pyspark>=4.0.0",
]
streaming = [
    "confluent-kafka>=2.15.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
